name: JPStellaVeil
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.example.jpstellaveil
    GENERATE_INFOPLIST_FILE: YES
packages: {}
targets:
  JPStellaVeil:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: JPStellaVeil
    scheme:
      testTargets:
        - JPStellaVeilTests
  JPStellaVeilTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/JPStellaVeilTests
    dependencies:
      - target: JPStellaVeil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jpstellaveil.tests
